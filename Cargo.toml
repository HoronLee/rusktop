[workspace]
resolver = "3"
members = ["crates/rusktop-core", "crates/rusktop-ui/", "crates/rusktop-app", "crates/konfig", "crates/lug"]

default-members = ["crates/rusktop-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"

# Database
sea-orm = { version = "2.0.0-rc.32", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "schema-sync", "entity-registry"] }
sea-orm-migration = { version = "2.0.0-rc.32", features = ["sqlx-sqlite", "runtime-tokio-rustls"] }

# Dependency injection
shaku = "0.6"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"

# Protobuf / gRPC
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"

# UI
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

# Internal crates
konfig = { path = "crates/konfig" }
lug = { path = "crates/lug" }
rusktop-core = { path = "crates/rusktop-core" }
rusktop-ui = { path = "crates/rusktop-ui" }
