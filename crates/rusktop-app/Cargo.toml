[package]
name = "rusktop-app"
version.workspace = true
edition.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ui"))'] }

[features]
default = ["ui"]
ui = ["dep:rusktop-ui"]

[dependencies]
rusktop-core.workspace = true
rusktop-ui = { workspace = true, optional = true }
rusktop-web.workspace = true
clap.workspace = true
konfig.workspace = true
lug.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
